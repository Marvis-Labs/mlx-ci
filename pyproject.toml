[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marvis-mlx-ci"
version = "0.1.0"
description = "Trusted control plane for Marvis-Labs Apple-silicon CI"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["mlx_ci*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
