name: CI request

on:
  repository_dispatch:
    types: [ci-run-request]

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prepare-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pull_request }}
      queue: max
    permissions:
      actions: read
      contents: read
    outputs:
      coalesced: ${{ steps.prepare.outputs.coalesced }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      repository: ${{ steps.prepare.outputs.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mlx-vlm
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
      - name: Validate request and pin revisions
        id: prepare
        env:
          CI_ACTIONS_TOKEN: ${{ github.token }}
          CI_ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python -m runners.prepare
          --event "$GITHUB_EVENT_PATH"
          --engines engines
          --output attempt.json
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.prepare.outputs.coalesced != 'true'
        with:
          repository: ${{ steps.prepare.outputs.repository }}
          ref: ${{ steps.prepare.outputs.contract_sha }}
          path: participant
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: Plan repository work
        if: steps.prepare.outputs.coalesced != 'true'
        run: >-
          python participant/ci/plan.py
          --attempt attempt.json
          --output plan.json
      - name: Seal jobs
        if: steps.prepare.outputs.coalesced != 'true'
        run: >-
          python -m runners.actions seal
          --attempt attempt.json
          --plan plan.json
          --engines engines
          --output jobs.json
      - name: Build runner matrix
        id: matrix
        if: steps.prepare.outputs.coalesced != 'true'
        run: >-
          python -m runners.actions matrix
          --jobs jobs.json
          --engines engines
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.prepare.outputs.coalesced != 'true'
        with:
          name: ci-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            attempt.json
            plan.json
            jobs.json
            participant/ci/output.py
          if-no-files-found: error
          retention-days: 7
      - name: Notify participant repository
        if: steps.prepare.outputs.coalesced == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ steps.prepare.outputs.repository }}
        run: |
          gh api "repos/$REPOSITORY/dispatches" --method POST \
            -f event_type=ci-run-coalesced \
            -F 'client_payload[schema_version]=1' \
            -F "client_payload[pull_request]=$(jq -r .pull_request attempt.json)" \
            -F "client_payload[comment_id]=$(jq -r .comment_id attempt.json)" \
            -F "client_payload[requested_at]=$(jq -r .requested_at attempt.json)" \
            -F "client_payload[base_sha]=$(jq -r .base_sha attempt.json)" \
            -F "client_payload[head_sha]=$(jq -r .head_sha attempt.json)"

  execute:
    needs: prepare
    if: needs.prepare.outputs.coalesced != 'true' && needs.prepare.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on:
      group: marvis-apple-silicon
      labels: [marvis-ci, apple-silicon, mlx-ci-sandbox-v2, "${{ matrix.memory_label }}"]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: request
      - name: Extract sealed job
        run: >-
          uv run --frozen python -m runners.actions job
          --jobs request/jobs.json
          --job-id "${{ matrix.job_id }}"
          --engines engines
          --output job.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.contract_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.head_repository }}
          ref: ${{ matrix.head_sha }}
          path: head
          persist-credentials: false
      - name: Run sealed job
        id: execute
        env:
          CI_JOB_REPOSITORY: ${{ matrix.repository }}
          CI_ORCHESTRATOR_ROOT: ${{ github.workspace }}
        run: |
          started_ms="$(/usr/bin/python3 -c 'import time; print(int(time.time() * 1000))')"
          echo "started_ms=$started_ms" >> "$GITHUB_OUTPUT"
          /usr/local/libexec/marvis-ci/RUN_JOB.sh \
            "$GITHUB_WORKSPACE/job.json" \
            "$GITHUB_WORKSPACE/raw-result.json" \
            -- /usr/bin/python3 -m ci.work_executor \
            --job "$GITHUB_WORKSPACE/job.json" \
            --control "$GITHUB_WORKSPACE/control" \
            --base "$GITHUB_WORKSPACE/control" \
            --head "$GITHUB_WORKSPACE/head"
      - name: Sanitize runner result
        if: always()
        env:
          JOB_ID: ${{ matrix.job_id }}
          STARTED_MS: ${{ steps.execute.outputs.started_ms }}
        run: |
          chip="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || printf 'Apple silicon')"
          memory_gib="$(($(sysctl -n hw.memsize) / 1024 / 1024 / 1024))"
          uv run --frozen python -m runners.actions normalize \
            --jobs job.json \
            --raw raw-result.json \
            --chip "$chip" \
            --memory-gib "$memory_gib" \
            --started-ms "${STARTED_MS:-0}" \
            --engines engines \
            --output "${JOB_ID}.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ci-result-${{ matrix.job_id }}
          path: ${{ matrix.job_id }}.json
          if-no-files-found: error
          retention-days: 7

  collect:
    needs: [prepare, execute]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.coalesced != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: request
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.prepare.outputs.has_jobs == 'true'
        continue-on-error: true
        with:
          pattern: ci-result-*
          path: results
          merge-multiple: true
      - name: Validate and collect results
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m runners.actions collect
          --attempt request/attempt.json
          --jobs request/jobs.json
          --results results
          --run-url "$RUN_URL"
          --engines engines
          --output bundle.json
      - name: Render Mixie comment
        id: comment
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python request/participant/ci/output.py comment
          --bundle bundle.json
          --repository "${{ needs.prepare.outputs.repository }}"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --output "$RUNNER_TEMP/comment.md"
          --request "$RUNNER_TEMP/comment.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mlx-vlm
          permission-pull-requests: write
      - name: Post Mixie comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.comment.outputs.pull_request }}
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
        run: >-
          gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments"
          --method POST
          --input "$RUNNER_TEMP/comment.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce CI verdict
        run: >-
          python -m runners.actions gate
          --results bundle.json
          --engines engines
