name: Repository CI plan

on:
  repository_dispatch:
    types: [ci-plan-request]

permissions: {}

concurrency:
  group: ci-plan-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.pull_request }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orchestrator
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: |
            mlx-vlm
            mlx-audio
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
      - name: Authorize immutable plan
        id: authorization
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=orchestrator python -m mlx_ci.github_dispatch \
            --event "$GITHUB_EVENT_PATH" \
            --repository Marvis-Labs/mlx-vlm \
            --repository Marvis-Labs/mlx-audio \
            --output authorization.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          repository: ${{ steps.authorization.outputs.repository }}
          ref: ${{ steps.authorization.outputs.contract_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          repository: ${{ steps.authorization.outputs.repository }}
          ref: ${{ steps.authorization.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          repository: ${{ steps.authorization.outputs.head_repository }}
          ref: ${{ steps.authorization.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify immutable checkouts
        env:
          BASE_SHA: ${{ steps.authorization.outputs.base_sha }}
          CONTRACT_SHA: ${{ steps.authorization.outputs.contract_sha }}
          HEAD_SHA: ${{ steps.authorization.outputs.head_sha }}
        run: |
          [[ "$(git -C control rev-parse --verify HEAD^{commit})" == "$CONTRACT_SHA" ]]
          [[ "$(git -C base rev-parse --verify HEAD^{commit})" == "$BASE_SHA" ]]
          [[ "$(git -C head rev-parse --verify HEAD^{commit})" == "$HEAD_SHA" ]]
          for checkout in control base head; do
            [[ -z "$(git -C "$checkout" config --local --get-regexp '^http\..*\.extraheader$' || true)" ]]
            [[ -z "$(git -C "$checkout" status --porcelain=v1 --untracked-files=all)" ]]
          done
      - name: Install hosted dependencies
        run: python -m pip install --quiet --require-hashes -r control/ci/requirements.txt
      - name: Build repository plan
        id: planning
        env:
          BASE_SHA: ${{ steps.authorization.outputs.base_sha }}
          CONTRACT_SHA: ${{ steps.authorization.outputs.contract_sha }}
          HEAD_SHA: ${{ steps.authorization.outputs.head_sha }}
          PR_NUMBER: ${{ steps.authorization.outputs.pull_request }}
          REPOSITORY: ${{ steps.authorization.outputs.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PYTHONPATH=orchestrator:control python -m mlx_ci.repository.adapter plan \
            --repository-path control \
            --base-checkout base \
            --head-checkout head \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --contract-sha "$CONTRACT_SHA" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --run-url "$RUN_URL" \
            --output control.json \
            --summary summary.md \
            --github-output "$GITHUB_OUTPUT"
      - name: Run hosted checks
        id: hosted
        if: steps.planning.outputs.has_hosted_checks == 'true'
        env:
          BASE_SHA: ${{ steps.authorization.outputs.base_sha }}
          HEAD_SHA: ${{ steps.authorization.outputs.head_sha }}
        run: |
          PYTHONPATH=orchestrator:control python -m mlx_ci.repository.adapter hosted-checks \
            --control control.json \
            --repository-path control \
            --base-checkout base \
            --head-checkout head \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output resolved-control.json \
            --summary hosted-summary.md \
            --github-output "$GITHUB_OUTPUT"
          mv hosted-summary.md summary.md
      - name: Publish plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.authorization.outputs.head_sha }}
          PR_NUMBER: ${{ steps.authorization.outputs.pull_request }}
          REPOSITORY: ${{ steps.authorization.outputs.repository }}
        run: |
          printf '\n<!-- mlx-ci-plan:%s -->\n' "$HEAD_SHA" >> summary.md
          marker="<!-- mlx-ci-plan:$HEAD_SHA -->"
          if ! gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate --slurp \
            | jq -r '.[].[] | .body' | grep -Fqx "$marker"; then
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@summary.md
          fi
      - name: Publish planning failure
        if: >
          always() &&
          steps.authorization.outcome == 'success' &&
          (steps.planning.outcome != 'success' || steps.hosted.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.authorization.outputs.head_sha }}
          PR_NUMBER: ${{ steps.authorization.outputs.pull_request }}
          REPOSITORY: ${{ steps.authorization.outputs.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '⚠️ **CI planning failed** · Commit: `%s` · [View run](%s)\n' \
            "$HEAD_SHA" "$RUN_URL" > failure.md
          gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@failure.md
      - name: Enforce plan
        if: >
          steps.planning.outputs.outcome == 'blocked' ||
          steps.hosted.outputs.outcome == 'test_failure' ||
          steps.hosted.outputs.outcome == 'infrastructure_failure'
        run: exit 1
