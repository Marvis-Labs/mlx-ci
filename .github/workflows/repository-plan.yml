name: Repository CI plan

on:
  workflow_call:

permissions: {}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_hosted_checks: ${{ steps.control.outputs.has_hosted_checks || 'false' }}
    steps:
      - name: Verify immutable control-plane revision
        env:
          CONTROL_PLANE_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_PLANE_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$CONTROL_PLANE_REPOSITORY" == Marvis-Labs/mlx-ci ]]
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Fetch immutable pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git -C control fetch --no-tags origin "pull/$PR_NUMBER/head"
          [[ "$(git -C control rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]]
      - name: Install repository-owned hosted dependencies
        run: python -m pip install --quiet --require-hashes -r control/ci/hosted-requirements.txt
      - name: Materialize contributor configuration
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/repository-ci"
          PYTHONPATH=control python -m ci.component_config \
            --repository control \
            --revision "$HEAD_SHA" \
            --output "$RUNNER_TEMP/repository-ci"
      - name: Build trusted repository plan
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PYTHONPATH=control python -m ci.control plan \
            --repository-path control \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$REPOSITORY" \
            --contract-sha "$BASE_SHA" \
            --pr "$PR_NUMBER" \
            --rules-config control/ci/change-rules.yaml \
            --component-config-directory "$RUNNER_TEMP/repository-ci" \
            --protected-config control/ci/protected_paths.yaml \
            --run-url "$RUN_URL" \
            --output control.json \
            --markdown summary.md \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish planning summary
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-plan-${{ github.run_id }}
          path: control.json
          retention-days: 1
      - name: Enforce planning blockers
        if: steps.control.outputs.outcome == 'blocked'
        run: exit 1

  hosted_checks:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.has_hosted_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repository-plan-${{ github.run_id }}
      - name: Fetch immutable pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git -C control fetch --no-tags origin "pull/$PR_NUMBER/head"
          [[ "$(git -C control rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]]
      - name: Install repository-owned hosted dependencies
        run: python -m pip install --quiet --require-hashes -r control/ci/hosted-requirements.txt
      - name: Run trusted hosted checks
        id: hosted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=control python -m ci.hosted_checks \
            --control control.json \
            --repository-path control \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output resolved-control.json \
            --markdown hosted-summary.md \
            --github-output "$GITHUB_OUTPUT"
          cat hosted-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce hosted-check result
        if: steps.hosted.outputs.outcome != 'passed'
        run: exit 1
